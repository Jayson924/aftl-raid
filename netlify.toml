[build]
  command = "if [ \"$RECRUIT_BUILD\" = \"true\" ]; then npm run build:recruit; else npm run build; fi"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/data/sim/*.json"]

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
