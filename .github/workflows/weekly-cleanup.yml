name: Weekly Lineup Cleanup

on:
  schedule:
    # Runs daily at 23:00 UTC (4:00 PM PT) - job checks if it's Friday PT before running
    - cron: '0 23 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Check if Friday in Pacific Time
        id: check-day
        run: |
          # Get current day in Pacific Time (handles PST/PDT automatically)
          DAY=$(TZ="America/Los_Angeles" date +%u)
          echo "Day of week (Pacific): $DAY (5=Friday)"
          if [ "$DAY" = "5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping - not Friday in Pacific Time"
          fi

      - name: Weekly Lineup Cleanup
        if: steps.check-day.outputs.should_run == 'true'
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/weekly_lineup_cleanup" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -ne 200 ]; then
            echo "Error: Cleanup failed with status $http_code"
            exit 1
          fi

          echo "Cleanup completed successfully!"
